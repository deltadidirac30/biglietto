<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<!-- Non far comparire la pagina nei motori di ricerca -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<title>Emanuele D'Alessio</title>
<script>
/* =====================================================================
   I TUOI DATI — modifica solo qui.
   Un campo lasciato vuoto ("") non compare nella pagina.
   Telefono ed email sono spezzati in pezzi per non essere letti dai bot:
     telefono: i pezzi vengono uniti così come sono  -> "+39" "123" "456" "7890"
     email:    i due pezzi vengono uniti con la @     -> "nome.cognome" "uniroma1.it"
   ATTENZIONE: se cambi qualcosa, aggiorna allo stesso modo anche contatto.vcf
   ===================================================================== */
const DATI = {
  nome: "Emanuele",
  cognome: "D'Alessio",
  ruolo: "Dottorando",
  ente: "Sapienza Università di Roma",
  dipartimento: "SEA",
  telefono: [],
  email: ["emanuele.dalessio", "uniroma1.it"],
  indirizzo: "Via Eudossiana 18, 00184 Roma",
  sito: "",
  linkedin: "",
  foto: "foto.jpg"
};
</script>
<style>
  :root {
    --bg: #0b0b0c;
    --card: #1b1b1e;
    --card-2: #232327;
    --line: #2c2c31;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #8c1d2f;
    --accent-hi: #a6243a;
    --accent-soft: rgba(140, 29, 47, 0.22);
    --accent-ink: #e8a0ac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 390px;
    background: var(--card);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
  .hero {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--card-2);
  }
  .hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(27,27,30,0) 45%, rgba(27,27,30,0.55) 72%, var(--card) 100%);
    pointer-events: none;
  }
  .initials {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    background: radial-gradient(circle at 30% 25%, var(--accent-hi), var(--accent) 45%, #3a0d15 100%);
  }
  .body {
    position: relative;
    margin-top: -56px;
    padding: 0 20px 24px;
    z-index: 1;
  }
  h1 {
    font-size: 30px;
    line-height: 1.12;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .role {
    margin-top: 6px;
    color: var(--muted);
    font-size: 16px;
  }
  .org {
    margin-top: 4px;
    font-size: 15px;
    font-weight: 650;
    color: var(--text);
  }
  .save {
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 20px;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 650;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(140, 29, 47, 0.45);
    transition: background .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .save:hover { background: var(--accent-hi); }
  .save:active { transform: scale(0.98); }
  .save svg { width: 22px; height: 22px; flex: none; }
  .list {
    margin-top: 22px;
    list-style: none;
    border-top: 1px solid var(--line);
  }
  .list a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .list li:last-child a { border-bottom: 0; }
  .list a:active { background: rgba(255,255,255,0.03); }
  .ico {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .ico svg { width: 20px; height: 20px; }
  .txt { min-width: 0; flex: 1; }
  .lbl {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .val {
    display: block;
    margin-top: 2px;
    font-size: 15px;
    color: var(--text);
    overflow-wrap: break-word;
  }
  .chev { flex: none; color: #55555c; }
  .chev svg { width: 18px; height: 18px; display: block; }
</style>
</head>
<body>
<main class="card">
  <div class="hero" id="hero"></div>
  <div class="body">
    <h1 id="nome"></h1>
    <p class="role" id="ruolo"></p>
    <p class="org" id="org"></p>

    <!-- Pulsante principale: link semplice alla vCard, SENZA attributo download -->
    <a class="save" href="contatto.vcf" rel="nofollow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Salva contatto
    </a>

    <ul class="list" id="lista"></ul>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const d = DATI;
  const nomeCompleto = [d.nome, d.cognome].filter(Boolean).join(" ");
  document.title = nomeCompleto;

  // Foto o iniziali
  const hero = $("hero");
  const iniziali = () => {
    hero.innerHTML = "";
    const div = document.createElement("div");
    div.className = "initials";
    div.textContent = ((d.nome || " ")[0] + (d.cognome || " ")[0]).toUpperCase().trim();
    hero.appendChild(div);
  };
  if (d.foto) {
    const img = new Image();
    img.src = d.foto;
    img.alt = nomeCompleto;
    img.onerror = iniziali;
    hero.appendChild(img);
  } else {
    iniziali();
  }

  $("nome").textContent = nomeCompleto;
  if (d.ruolo) $("ruolo").textContent = d.ruolo; else $("ruolo").remove();
  const org = [d.dipartimento, d.ente].filter(Boolean).join(" · ");
  if (org) $("org").textContent = org; else $("org").remove();

  // es. +391234567890 -> +39 123 456 7890
  function formattaTelefono(t) {
    const s = String(t).replace(/[^\d+]/g, "");
    const m = s.match(/^\+39(\d{3})(\d{3})(\d{3,4})$/);
    return m ? `+39 ${m[1]} ${m[2]} ${m[3]}` : t;
  }
  const pulito = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

  const I = {
    tel: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    web: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    li: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
    org: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>'
  };
  const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const chev = svg('<path d="m9 18 6-6-6-6"/>');

  const voci = [];
  const unisci = (v, sep) => Array.isArray(v) ? v.filter(Boolean).join(sep) : (v || "");
  const tel = unisci(d.telefono, "").replace(/\s/g, "");
  const mail = unisci(d.email, "@");
  if (tel) voci.push({ i: I.tel, l: "Telefono", v: formattaTelefono(tel), h: "tel:" + tel });
  if (mail) voci.push({ i: I.mail, l: "Email", v: mail, h: "mailto:" + mail });
  if (d.indirizzo) voci.push({ i: I.pin, l: "Ufficio", v: d.indirizzo, h: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(d.indirizzo), nuova: true });
  if (d.sito) voci.push({ i: I.web, l: "Sito web", v: pulito(d.sito), h: d.sito, nuova: true });
  if (d.linkedin) voci.push({ i: I.li, l: "LinkedIn", v: pulito(d.linkedin), h: d.linkedin, nuova: true });

  const ul = $("lista");
  voci.forEach((x) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = x.h;
    if (x.nuova) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = `<span class="ico">${svg(x.i)}</span><span class="txt"><span class="lbl"></span><span class="val"></span></span><span class="chev">${chev}</span>`;
    a.querySelector(".lbl").textContent = x.l;
    const val = a.querySelector(".val");
    // permette di andare a capo dopo "@" o "/" invece che a metà parola
    x.v.split(/(?<=[@\/])/).forEach((pezzo, k) => {
      if (k) val.appendChild(document.createElement("wbr"));
      val.appendChild(document.createTextNode(pezzo));
    });
    li.appendChild(a);
    ul.appendChild(li);
  });
})();
</script>
</body>
</html>
